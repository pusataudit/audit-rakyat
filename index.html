<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT RAKYAT - PRO INQUISITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .input-style { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 12px; width: 100%; color: white; font-size: 14px; transition: 0.3s; }
        .input-style:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 15px rgba(56,189,248,0.3); }
        .label-audit { display: block; text-transform: uppercase; font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 5px; margin-left: 4px; letter-spacing: 1px; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); padding: 16px; border-radius: 12px; font-weight: 800; text-transform: uppercase; width: 100%; color: white; border: none; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.4); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-4 md:p-10 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black min-h-screen">
    
    <div class="max-w-4xl mx-auto glass-card p-8 shadow-2xl border-t-4 border-blue-500 mb-10">
        <header class="mb-10">
            <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 via-emerald-400 to-blue-500 bg-clip-text text-transparent uppercase tracking-tighter">Portal Investigasi Nasional</h1>
            <p class="text-slate-400 text-xs font-bold mt-2 uppercase tracking-[0.2em]">Otoritas Pengawasan Publik & Audit Rakyat</p>
        </header>

        <form id="auditForm" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="label-audit">Pelapor / Inisial</label>
                    <input type="text" id="nama" class="input-style" placeholder="Nama Anda" required>
                </div>
                <div>
                    <label class="label-audit">WhatsApp</label>
                    <input type="tel" id="whatsapp" class="input-style" placeholder="08..." required>
                </div>
                <div>
                    <label class="label-audit">Email Resmi</label>
                    <input type="email" id="email" class="input-style" placeholder="email@contoh.com" required>
                </div>
            </div>

            <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-5">
                <p class="md:col-span-2 text-blue-400 font-black text-[10px] uppercase border-b border-slate-800 pb-3 tracking-widest">Otoritas Wilayah</p>
                <div>
                    <label class="label-audit">Provinsi</label>
                    <select id="provinsi" class="input-style" onchange="loadKota()"><option value="">Memuat...</option></select>
                </div>
                <div>
                    <label class="label-audit">Kabupaten / Kota</label>
                    <select id="kota" class="input-style" onchange="loadKecamatan()" disabled><option value="">Pilih Provinsi</option></select>
                </div>
                <div>
                    <label class="label-audit">Kecamatan</label>
                    <select id="kecamatan" class="input-style" onchange="loadKelurahan()" disabled><option value="">Pilih Kota</option></select>
                </div>
                <div>
                    <label class="label-audit">Kelurahan / Desa</label>
                    <select id="kelurahan" class="input-style" disabled><option value="">Pilih Kecamatan</option></select>
                </div>
                <div class="md:col-span-2">
                    <label class="label-audit">RW / Dusun / Detail Lokasi</label>
                    <input type="text" id="rw" class="input-style" placeholder="Contoh: RW 05 / Dusun Krajan">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="label-audit">Sektor Audit (100+ Sektor Terbuka)</label>
                    <select id="kategori" class="input-style">
                        <optgroup label="INFRASTRUKTUR & RUANG">
                            <option value="JALAN_JEMBATAN">PEKERJAAN UMUM (JALAN/JEMBATAN)</option>
                            <option value="MAFIA_TANAH">AGRARIA / MAFIA TANAH / SERTIFIKAT</option>
                            <option value="SDA_BENDUNGAN">SUMBER DAYA AIR / IRIGASI</option>
                        </optgroup>
                        <optgroup label="EKONOMI & SDA">
                            <option value="TAMBANG_ENERGI">ESDM / TAMBANG / MIGAS</option>
                            <option value="PERTANIAN_PUPUK">PERTANIAN / PUPUK SUBSIDI</option>
                            <option value="LINGKUNGAN_HIDUP">LINGKUNGAN HIDUP / LIMBAH</option>
                        </optgroup>
                        <optgroup label="SOSIAL & DESA">
                            <option value="DANA_DESA">DANA DESA / BUMDES</option>
                            <option value="BANSOS_PKH">BANTUAN SOSIAL / PKH / BLT</option>
                            <option value="DIK_BOS">PENDIDIKAN / DANA BOS</option>
                        </optgroup>
                        <option value="LAINNYA">SEKTOR LAINNYA...</option>
                    </select>
                </div>
                <div>
                    <label class="label-audit">Estimasi Nilai Kerugian (Rp)</label>
                    <input type="number" id="kerugian" class="input-style" placeholder="Misal: 1000000000">
                </div>
            </div>

            <div>
                <label class="label-audit">Modus Operandi Iblis</label>
                <select id="modus" class="input-style">
                    <option value="MARK_UP">MARK-UP (PENGGELEMBUNGAN HARGA)</option>
                    <option value="FIKTIF">KEGIATAN / PENGADAAN FIKTIF</option>
                    <option value="PUNGLI">PEMOTONGAN DANA / PUNGLI / SUAP</option>
                    <option value="SPEK_RENDAH">KUALITAS RENDAH (TIDAK SESUAI SPEK)</option>
                </select>
            </div>

            <div>
                <label class="label-audit">Kronologi Temuan (PT / Pejabat / Proyek)</label>
                <textarea id="deskripsi" rows="5" class="input-style" placeholder="Jelaskan secara detail temuan investigasi Anda..."></textarea>
            </div>

            <div class="p-8 border-2 border-dashed border-slate-700 rounded-3xl bg-slate-900/30 text-center">
                <label class="block text-blue-400 font-black mb-4 uppercase text-xs tracking-widest">Lampiran Bukti (PDF, FOTO, VIDEO)</label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" class="text-slate-500 text-xs">
            </div>

            <button type="button" onclick="showPreview()" class="btn-primary">Verifikasi Laporan</button>
        </form>
    </div>

    <div id="previewModal" class="modal">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-2xl w-full">
            <h2 class="text-2xl font-black mb-6 text-blue-400 uppercase tracking-tighter">Konfirmasi Data</h2>
            <div id="previewContent" class="space-y-3 text-slate-300 text-sm"></div>
            <div class="flex gap-4 mt-10">
                <button onclick="closePreview()" class="w-1/3 p-4 rounded-xl border border-slate-800 font-bold uppercase text-[10px]">Edit</button>
                <button id="publishBtn" onclick="submitData()" class="w-2/3 btn-primary bg-blue-600">Kirim & Kunci Laporan</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzaNURWmMEXgyzZzw4hpDiaZjHvjzTo---vwJUcAtPRxd0E5ERk4GuRmdTZc7MDC8-c/exec';
        const cloudName = 'dz9es8mz9';
        const uploadPreset = 'm6x8jz8g';
        const API_BASE = 'https://www.emsifa.com/api-wilayah-indonesia/api';

        window.onload = async () => {
            const res = await fetch(`${API_BASE}/provinces.json`);
            const data = await res.json();
            let html = '<option value="">-- PILIH PROVINSI --</option>';
            data.forEach(p => html += `<option value="${p.id}" data-name="${p.name}">${p.name}</option>`);
            document.getElementById('provinsi').innerHTML = html;
        };

        async function loadKota() {
            const id = document.getElementById('provinsi').value;
            const res = await fetch(`${API_BASE}/regencies/${id}.json`);
            const data = await res.json();
            let html = '<option value="">-- PILIH KOTA --</option>';
            data.forEach(p => html += `<option value="${p.id}" data-name="${p.name}">${p.name}</option>`);
            const s = document.getElementById('kota'); s.innerHTML = html; s.disabled = false;
        }

        async function loadKecamatan() {
            const id = document.getElementById('kota').value;
            const res = await fetch(`${API_BASE}/districts/${id}.json`);
            const data = await res.json();
            let html = '<option value="">-- PILIH KECAMATAN --</option>';
            data.forEach(p => html += `<option value="${p.id}" data-name="${p.name}">${p.name}</option>`);
            const s = document.getElementById('kecamatan'); s.innerHTML = html; s.disabled = false;
        }

        async function loadKelurahan() {
            const id = document.getElementById('kecamatan').value;
            const res = await fetch(`${API_BASE}/villages/${id}.json`);
            const data = await res.json();
            let html = '<option value="">-- PILIH KELURAHAN --</option>';
            data.forEach(p => html += `<option value="${p.id}" data-name="${p.name}">${p.name}</option>`);
            const s = document.getElementById('kelurahan'); s.innerHTML = html; s.disabled = false;
        }

        function showPreview() {
            const getT = (id) => document.getElementById(id).options[document.getElementById(id).selectedIndex]?.text || "-";
            const content = `
                <p>PELAPOR: <b>${document.getElementById('nama').value}</b></p>
                <p>EMAIL: <b>${document.getElementById('email').value}</b></p>
                <p>LOKASI: <b>${getT('provinsi')} > ${getT('kota')}</b></p>
                <p>SEKTOR: <b>${document.getElementById('kategori').value}</b></p>
                <p>KERUGIAN: <b class="text-emerald-400">Rp ${new Intl.NumberFormat('id-ID').format(document.getElementById('kerugian').value)}</b></p>
            `;
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        async function submitData() {
            const btn = document.getElementById('publishBtn');
            btn.disabled = true; btn.innerHTML = "MENGUNCI & UPLOADING...";
            
            try {
                const files = document.getElementById('fileInput').files;
                let fileUrls = [];
                for (let file of files) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', uploadPreset);
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, { method: 'POST', body: formData });
                    const resData = await res.json();
                    fileUrls.push(resData.secure_url);
                }

                const getVal = (id) => document.getElementById(id).options[document.getElementById(id).selectedIndex]?.getAttribute('data-name') || "";

                const payload = {
                    nama: document.getElementById('nama').value,
                    whatsapp: document.getElementById('whatsapp').value,
                    email: document.getElementById('email').value,
                    entitas: "PEMERINTAH",
                    provinsi: getVal('provinsi'),
                    kota: getVal('kota'),
                    kec: getVal('kecamatan'),
                    kel: getVal('kelurahan'),
                    rw: document.getElementById('rw').value,
                    kategori: document.getElementById('kategori').value,
                    deskripsi: `[MODUS: ${document.getElementById('modus').value}] ` + document.getElementById('deskripsi').value,
                    kerugian: document.getElementById('kerugian').value,
                    linkBukti: fileUrls.join(", ")
                };

                await fetch(scriptURL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    body: JSON.stringify(payload) 
                });

                alert("LAPORAN BERHASIL DIKUNCI!");
                location.reload();
            } catch (e) {
                alert("Terjadi kesalahan. Cek koneksi.");
                btn.disabled = false; btn.innerHTML = "Kirim & Kunci Laporan";
            }
        }
    </script>
</body>
</html>
