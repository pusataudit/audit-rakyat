<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT RAKYAT - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .input-style { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 14px; width: 100%; color: white; transition: 0.3s; }
        .input-style:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); padding: 16px; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; width: 100%; cursor: pointer; border: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen">
    <div class="max-w-4xl mx-auto glass-card p-8 md:p-12 shadow-2xl">
        <header class="mb-10">
            <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent mb-2 uppercase">Pusat Data Audit</h1>
            <p class="text-slate-400 font-medium italic">Sistem Investigasi Rakyat - Independen & Terkunci</p>
        </header>

        <form id="auditForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">Nama / Inisial</label>
                    <input type="text" id="nama" class="input-style" placeholder="Anonim / Nama" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">Sektor Audit</label>
                    <select id="kategori" class="input-style">
                        <optgroup label="KEUANGAN & HUKUM">
                            <option value="KORUPSI">KORUPSI & GRATIFIKASI</option>
                            <option value="PERPAJAKAN">PERPAJAKAN & BEA CUKAI</option>
                            <option value="PENCUCIAN_UANG">PENCUCIAN UANG (TPPU)</option>
                        </optgroup>
                        <optgroup label="PEMBANGUNAN">
                            <option value="INFRASTRUKTUR">PROYEK FISIK (JALAN/GEDUNG)</option>
                            <option value="LINGKUNGAN">TAMBANG / LINGKUNGAN</option>
                        </optgroup>
                        <optgroup label="LAYANAN PUBLIK">
                            <option value="PENDIDIKAN">PENDIDIKAN (BOS/BEASISWA)</option>
                            <option value="KESEHATAN">KESEHATAN (ALKES/BPJS)</option>
                            <option value="BANSOS">DANA DESA / BANSOS</option>
                        </optgroup>
                        <option value="LAINNYA">LAIN-LAIN</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">WhatsApp</label>
                    <input type="tel" id="whatsapp" class="input-style" placeholder="08..." required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">Estimasi Nilai Kerugian (Rp)</label>
                    <input type="number" id="kerugian" class="input-style" placeholder="Input Angka Saja" required>
                </div>
            </div>

            <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">Lokasi & Instansi</label>
            <input type="text" id="lokasi" class="input-style" placeholder="Kota - Nama Dinas" required>

            <label class="block text-xs font-bold text-slate-300 mb-2 uppercase">Kronologi Temuan</label>
            <textarea id="deskripsi" rows="5" class="input-style" placeholder="Jelaskan secara mendalam..." required></textarea>

            <div class="p-6 border-2 border-dashed border-slate-700 rounded-2xl bg-slate-800/50 text-center">
                <label class="block text-blue-400 font-bold mb-3 uppercase text-sm underline">Lampiran Bukti (PDF, XLS, FOTO, VIDEO)</label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" class="text-slate-400 text-sm">
            </div>

            <button type="button" onclick="showPreview()" class="btn-primary">Tinjau Laporan (Preview)</button>
        </form>
    </div>

    <div id="previewModal" class="modal">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-2xl w-full">
            <h2 class="text-xl font-black mb-6 border-b border-slate-800 pb-4 uppercase tracking-widest">Verifikasi Data</h2>
            <div id="previewContent" class="space-y-4 text-slate-300 text-sm"></div>
            <div class="flex gap-4 mt-10">
                <button onclick="closePreview()" class="w-1/2 p-4 rounded-xl border border-slate-700 font-bold">EDIT</button>
                <button id="publishBtn" onclick="submitData()" class="w-1/2 btn-primary bg-emerald-600">PUBLISH & KUNCI</button>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="bg-slate-900 border border-emerald-500 p-10 rounded-3xl max-w-md w-full text-center">
            <h2 class="text-2xl font-black mb-2 uppercase">Diterima</h2>
            <p class="text-slate-400 mb-4">ID LAPORAN ANDA:</p>
            <div id="reportIDDisplay" class="text-3xl font-black py-4 bg-slate-800 border-2 border-emerald-500 rounded-2xl text-emerald-400 mb-8 tracking-widest"></div>
            <button onclick="location.reload()" class="w-full p-4 bg-white text-black font-black rounded-xl uppercase">SELESAI</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwy3PfCc4gIWkywnkE7vTvC77JYSvFhF7G_emjILVJYFS0ko7tqLDOQoajsulJE5ddj/exec';
        const cloudName = 'dz9es8mz9';
        const uploadPreset = 'm6x8jz8g';

        function showPreview() {
            const content = `
                <p>PELAPOR: <b>${document.getElementById('nama').value}</b></p>
                <p>SEKTOR: <b>${document.getElementById('kategori').value}</b></p>
                <p>LOKASI: <b>${document.getElementById('lokasi').value}</b></p>
                <p class="text-emerald-400">KERUGIAN: <b>Rp ${new Intl.NumberFormat('id-ID').format(document.getElementById('kerugian').value)}</b></p>
            `;
