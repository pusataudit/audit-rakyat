<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT RAKYAT - PROFESSIONAL EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .input-style { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 14px; width: 100%; color: white; transition: 0.3s; }
        .input-style:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); padding: 16px; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; width: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen flex items-center justify-center">

    <div class="max-w-4xl w-full glass-card p-8 md:p-12 shadow-2xl">
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent mb-2">PUSAT DATA AUDIT</h1>
            <p class="text-slate-400 font-medium">Sistem Pelaporan Independen & Anti-Manipulasi Data</p>
        </header>

        <form id="auditForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">Identitas / Inisial</label>
                    <input type="text" id="nama" class="input-style" placeholder="Nama Anda atau Anonim" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">Sektor Temuan</label>
                    <select id="kategori" class="input-style">
                        <option>KORUPSI</option>
                        <option>INFRASTRUKTUR</option>
                        <option>PERPAJAKAN</option>
                        <option>BIROKRASI</option>
                        <option>LAINNYA</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">WhatsApp Aktif</label>
                    <input type="tel" id="whatsapp" class="input-style" placeholder="08XXXXXXXXXX" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">Email (Opsional)</label>
                    <input type="email" id="email" class="input-style" placeholder="pelapor@email.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">Lokasi Kejadian & Instansi</label>
                <input type="text" id="lokasi" class="input-style" placeholder="Sebutkan Kota/Kabupaten & Nama Dinas" required>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2 uppercase">Detail Investigasi (Kronologi)</label>
                <textarea id="deskripsi" rows="5" class="input-style" placeholder="Jelaskan temuan audit Anda secara rinci..." required></textarea>
            </div>

            <div class="p-6 border-2 border-dashed border-slate-700 rounded-2xl bg-slate-800/50 text-center">
                <label class="block text-blue-400 font-bold mb-3 uppercase">Lampiran Bukti (Foto, Video, PDF, Excel)</label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" class="text-slate-400 text-sm">
                <p class="mt-2 text-xs text-slate-500 font-medium">Maksimal 5 file pendukung berkualitas tinggi.</p>
            </div>

            <button type="button" onclick="showPreview()" class="btn-primary">Tinjau Laporan (Preview)</button>
        </form>
    </div>

    <div id="previewModal" class="modal">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-2xl w-full shadow-2xl">
            <h2 class="text-2xl font-black mb-6 border-b border-slate-800 pb-4">KONFIRMASI DATA AUDIT</h2>
            <div id="previewContent" class="space-y-4 text-slate-300 leading-relaxed"></div>
            <div class="flex flex-col md:flex-row gap-4 mt-10">
                <button onclick="closePreview()" class="w-full p-4 rounded-xl border-2 border-slate-700 font-bold hover:bg-slate-800 transition">EDIT KEMBALI</button>
                <button id="publishBtn" onclick="submitData()" class="w-full btn-primary bg-emerald-600">PUBLISH & KUNCI DATA</button>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="bg-slate-900 border border-emerald-500/50 p-10 rounded-3xl max-w-md w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">✓</div>
            <h2 class="text-2xl font-black mb-2 uppercase tracking-widest">Laporan Diterima</h2>
            <p class="text-slate-400 mb-6">Nomor ID Pelaporan Anda:</p>
            <div id="reportIDDisplay" class="text-4xl font-black py-4 bg-slate-800 border-2 border-emerald-500 rounded-2xl text-emerald-400 mb-8 tracking-tighter"></div>
            <button onclick="location.reload()" class="w-full p-4 bg-white text-black font-black rounded-xl uppercase">Selesai</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        const cloudName = 'dz9es8mz9';
        const uploadPreset = 'm6x8jz8g';

        function showPreview() {
            const content = `
                <div class="grid grid-cols-2 gap-4">
                    <p><span class="text-slate-500 text-xs uppercase block">Pelapor:</span> <b>${document.getElementById('nama').value}</b></p>
                    <p><span class="text-slate-500 text-xs uppercase block">Sektor:</span> <b>${document.getElementById('kategori').value}</b></p>
                    <p><span class="text-slate-500 text-xs uppercase block">Lokasi:</span> <b>${document.getElementById('lokasi').value}</b></p>
                    <p><span class="text-slate-500 text-xs uppercase block">WhatsApp:</span> <b>${document.getElementById('whatsapp').value}</b></p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-800">
                    <span class="text-slate-500 text-xs uppercase block">Ringkasan Temuan:</span>
                    <p class="italic">"${document.getElementById('deskripsi').value.substring(0, 200)}..."</p>
                </div>
                <p class="mt-4 text-emerald-400 font-bold">✓ ${document.getElementById('fileInput').files.length} File bukti siap dienkripsi.</p>
            `;
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        async function submitData() {
            const btn = document.getElementById('publishBtn');
            btn.disabled = true; btn.innerHTML = "MENGUNCI DATA...";
            
            const files = document.getElementById('fileInput').files;
            let fileUrls = [];

            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', uploadPreset);
                formData.append('resource_type', 'auto'); // Otomatis deteksi PDF/Excel/Foto

                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, { method: 'POST', body: formData });
                    const resData = await res.json();
                    fileUrls.push(resData.secure_url);
                } catch (err) { console.error("Upload error", err); }
            }

            const data = {
                nama: document.getElementById('nama').value,
                whatsapp: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                linkBukti: fileUrls.join(", ")
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(response => {
                document.getElementById('previewModal').style.display = 'none';
                document.getElementById('successModal').style.display = 'flex';
                document.getElementById('reportIDDisplay').innerText = response.reportID;
            });
        }
    </script>
</body>
</html>
