<div class="bg-slate-800/40 p-6 rounded-3xl border border-slate-700 shadow-inner">
    <p class="text-emerald-400 font-black text-xs uppercase mb-6 tracking-widest border-b border-slate-700 pb-2 flex justify-between">
        <span>Lokasi Otoritas Administratif</span>
        <span class="text-slate-500">Data Terverifikasi API</span>
    </p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="label-audit">Provinsi</label>
            <select id="provinsi" class="input-style" onchange="loadKota()">
                <option value="">Memuat Provinsi...</option>
            </select>
        </div>

        <div>
            <label class="label-audit">Kabupaten / Kota</label>
            <select id="kota" class="input-style" onchange="loadKecamatan()" disabled>
                <option value="">Pilih Provinsi Terlebih Dahulu</option>
            </select>
        </div>

        <div>
            <label class="label-audit">Kecamatan (Wilayah Camat)</label>
            <select id="kecamatan" class="input-style" onchange="loadKelurahan()" disabled>
                <option value="">Pilih Kota/Kab Terlebih Dahulu</option>
            </select>
        </div>

        <div>
            <label class="label-audit">Kelurahan / Desa (Wilayah Lurah/Kades)</label>
            <select id="kelurahan" class="input-style" disabled>
                <option value="">Pilih Kecamatan Terlebih Dahulu</option>
            </select>
        </div>

        <div>
            <label class="label-audit">RW / Dusun / Lingkungan</label>
            <input type="text" id="rw" class="input-style" placeholder="Input Detail Wilayah Terkecil">
        </div>

        <div>
            <label class="label-audit">Instansi Terlapor</label>
            <select id="tipeEntitas" class="input-style">
                <option value="PEMERINTAH_DAERAH">PEMERINTAH DAERAH (KOTA/KAB)</option>
                <option value="PEMERINTAH_PUSAT">PEMERINTAH PUSAT (KEMENTERIAN)</option>
                <option value="BUMN_BUMD">BUMN / BUMD</option>
                <option value="SWASTA">PERUSAHAAN SWASTA</option>
                <option value="LSM_PARPOL">LSM / YAYASAN / PARPOL</option>
            </select>
        </div>
    </div>
</div>

<script>
// API Sumber Data Wilayah Indonesia (Seluruh Indonesia)
const API_BASE = 'https://www.emsifa.com/api-wilayah-indonesia/api';

// 1. Inisialisasi: Ambil Semua Provinsi saat halaman dibuka
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch(`${API_BASE}/provinces.json`);
        const provinces = await res.json();
        let html = '<option value="">-- PILIH PROVINSI --</option>';
        provinces.forEach(p => {
            html += `<option value="${p.id}" data-name="${p.name}">${p.name}</option>`;
        });
        document.getElementById('provinsi').innerHTML = html;
    } catch (e) { console.error("Gagal memuat data wilayah"); }
});

// 2. Fungsi Load Kota/Kabupaten
async function loadKota() {
    const provId = document.getElementById('provinsi').value;
    const kotaSelect = document.getElementById('kota');
    if (!provId) return;

    kotaSelect.innerHTML = '<option>Memuat...</option>';
    kotaSelect.disabled = false;

    const res = await fetch(`${API_BASE}/regencies/${provId}.json`);
    const regencies = await res.json();
    let html = '<option value="">-- PILIH KOTA/KABUPATEN --</option>';
    regencies.forEach(r => {
        html += `<option value="${r.id}" data-name="${r.name}">${r.name}</option>`;
    });
    kotaSelect.innerHTML = html;
}

// 3. Fungsi Load Kecamatan
async function loadKecamatan() {
    const kotaId = document.getElementById('kota').value;
    const kecSelect = document.getElementById('kecamatan');
    if (!kotaId) return;

    kecSelect.innerHTML = '<option>Memuat...</option>';
    kecSelect.disabled = false;

    const res = await fetch(`${API_BASE}/districts/${kotaId}.json`);
    const districts = await res.json();
    let html = '<option value="">-- PILIH KECAMATAN --</option>';
    districts.forEach(d => {
        html += `<option value="${d.id}" data-name="${d.name}">${d.name}</option>`;
    });
    kecSelect.innerHTML = html;
}

// 4. Fungsi Load Kelurahan
async function loadKelurahan() {
    const kecId = document.getElementById('kecamatan').value;
    const kelSelect = document.getElementById('kelurahan');
    if (!kecId) return;

    kelSelect.innerHTML = '<option>Memuat...</option>';
    kelSelect.disabled = false;

    const res = await fetch(`${API_BASE}/villages/${kecId}.json`);
    const villages = await res.json();
    let html = '<option value="">-- PILIH KELURAHAN --</option>';
    villages.forEach(v => {
        html += `<option value="${v.id}" data-name="${v.name}">${v.name}</option>`;
    });
    kelSelect.innerHTML = html;
}

// SAAT SUBMIT: Pastikan yang terkirim ke Google Sheets adalah NAMA, bukan ID Angka
async function getFormData() {
    const getSelName = (id) => {
        const el = document.getElementById(id);
        return el.options[el.selectedIndex]?.getAttribute('data-name') || "";
    };

    return {
        provinsi: getSelName('provinsi'),
        kota: getSelName('kota'),
        kecamatan: getSelName('kecamatan'),
        kelurahan: getSelName('kelurahan'),
        rw: document.getElementById('rw').value,
        tipeEntitas: document.getElementById('tipeEntitas').value,
        // ... field lainnya (nama, wa, deskripsi, kerugian, linkBukti)
    };
}
</script>
