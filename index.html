<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL AUDIT RAKYAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; }
        .audit-border { border: 4px solid #000; }
        .btn-black { background: #000; color: #fff; padding: 15px; font-weight: 900; text-transform: uppercase; width: 100%; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; overflow-y: auto; z-index: 50; }
        input, select, textarea { border: 3px solid #000; padding: 12px; width: 100%; font-weight: 600; margin-bottom: 15px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-3xl mx-auto">
        <div class="border-b-8 border-black pb-4 mb-8">
            <h1 class="text-4xl font-black uppercase">Pusat Data Audit</h1>
            <p class="font-bold bg-black text-white inline-block px-2">Kerahasiaan Terjamin & Anti-Manipulasi</p>
        </div>

        <form id="auditForm" class="space-y-2">
            <label class="font-black">NAMA / INISIAL</label>
            <input type="text" id="nama" required>
            
            <div class="grid grid-cols-2 gap-4">
                <div><label class="font-black">WA</label><input type="tel" id="whatsapp" required></div>
                <div><label class="font-black">SEKTOR</label>
                    <select id="kategori">
                        <option>KORUPSI</option><option>INFRASTRUKTUR</option><option>BIROKRASI</option>
                    </select>
                </div>
            </div>

            <label class="font-black">LOKASI & INSTANSI</label>
            <input type="text" id="lokasi" required>

            <label class="font-black">DETAIL TEMUAN</label>
            <textarea id="deskripsi" rows="5" required></textarea>

            <label class="font-black text-red-600">UNGGAH BUKTI (FOTO/VIDEO)</label>
            <input type="file" id="fileInput" multiple accept="image/*,video/*" class="border-dashed border-4 border-red-500 p-4">

            <button type="button" onclick="showPreview()" class="btn-black mt-4">Tinjau Laporan (Preview)</button>
        </form>
    </div>

    <div id="previewModal" class="modal">
        <div class="bg-white p-6 max-w-2xl mx-auto audit-border">
            <h2 class="text-2xl font-black border-b-4 border-black mb-4 uppercase">Verifikasi Data Laporan</h2>
            <div id="previewContent" class="space-y-3 font-bold text-gray-800"></div>
            <div class="flex gap-4 mt-8">
                <button onclick="closePreview()" class="w-1/2 border-4 border-black p-4 font-black">EDIT KEMBALI</button>
                <button id="publishBtn" onclick="submitData()" class="w-1/2 bg-green-600 text-white p-4 font-black shadow-lg">PUBLISH SEKARANG</button>
            </div>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="bg-white p-8 max-w-md mx-auto audit-border text-center">
            <div class="text-5xl mb-4">✅</div>
            <h2 class="text-2xl font-black mb-2">LAPORAN DIKUNCI</h2>
            <p class="font-bold text-gray-600">Simpan nomor laporan Anda sebagai bukti resmi:</p>
            <div id="reportIDDisplay" class="text-3xl font-black my-6 bg-yellow-300 p-4 border-2 border-black border-dashed"></div>
            <button onclick="location.reload()" class="btn-black">Selesai</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        const cloudName = 'dz9es8mz9';
        const uploadPreset = 'm6x8jz8g';

        function showPreview() {
            const content = `
                <p>NAMA: ${document.getElementById('nama').value}</p>
                <p>WA: ${document.getElementById('whatsapp').value}</p>
                <p>LOKASI: ${document.getElementById('lokasi').value}</p>
                <p>TEMUAN: ${document.getElementById('deskripsi').value.substring(0,100)}...</p>
                <p class="text-red-600">BUKTI: ${document.getElementById('fileInput').files.length} File terpilih</p>
            `;
            document.getElementById('previewContent').innerHTML = content;
            document.getElementById('previewModal').style.display = 'block';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        async function submitData() {
            const btn = document.getElementById('publishBtn');
            btn.disabled = true; btn.innerHTML = "MENGUNCI DATA...";
            
            const files = document.getElementById('fileInput').files;
            let fileUrls = [];

            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', uploadPreset);
                const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, { method: 'POST', body: formData });
                const resData = await res.json();
                fileUrls.push(resData.secure_url);
            }

            const data = {
                nama: document.getElementById('nama').value,
                whatsapp: document.getElementById('whatsapp').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                linkBukti: fileUrls.join(", ")
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(response => {
                document.getElementById('previewModal').style.display = 'none';
                document.getElementById('successModal').style.display = 'block';
                document.getElementById('reportIDDisplay').innerText = response.reportID;
            });
        }
    </script>
</body>
</html>
