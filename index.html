<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Rakyat - Pusat Laporan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
        .main-title { font-size: 2.5rem; font-weight: 800; color: #000000; letter-spacing: -0.02em; }
        label { font-size: 1.1rem !important; font-weight: 700 !important; color: #000000 !important; }
        input, select, textarea { font-size: 1.1rem !important; color: #000000 !important; border: 2px solid #e5e7eb !important; }
        input:focus, select:focus, textarea:focus { border-color: #000000 !important; ring: 0 !important; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-3xl mx-auto">
        <header class="mb-12 text-left border-b-4 border-black pb-6">
            <h1 class="main-title mb-2">PUSAT DATA AUDIT RAKYAT</h1>
            <p class="text-xl text-gray-800 font-medium">Sistem Pelaporan Transparansi dan Audit Independen.</p>
        </header>

        <div class="bg-white p-2">
            <form id="auditForm" class="space-y-8">
                <div>
                    <label class="block mb-2">Nama Pelapor / Inisial</label>
                    <input type="text" id="nama" class="w-full p-4 bg-white rounded-lg outline-none transition" placeholder="Masukkan nama atau anonim" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2">Sektor Audit</label>
                        <select id="kategori" class="w-full p-4 bg-white rounded-lg outline-none cursor-pointer">
                            <option>Korupsi</option>
                            <option>Infrastruktur</option>
                            <option>Pajak</option>
                            <option>Birokrasi</option>
                            <option>Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2">Lokasi Kejadian</label>
                        <input type="text" id="lokasi" class="w-full p-4 bg-white rounded-lg outline-none" placeholder="Kota atau Instansi">
                    </div>
                </div>

                <div>
                    <label class="block mb-2">Detail Laporan Temuan</label>
                    <textarea id="deskripsi" rows="5" class="w-full p-4 bg-white rounded-lg outline-none" placeholder="Tuliskan detail temuan audit Anda di sini..." required></textarea>
                </div>

                <div>
                    <label class="block mb-2 text-red-600">Link Bukti Foto / Video</label>
                    <input type="text" id="linkBukti" class="w-full p-4 bg-white rounded-lg outline-none mb-2 border-red-200" placeholder="Tempel link bukti di sini (Google Drive/Cloudinary/dll)">
                    <p class="text-sm text-gray-600 font-bold">*Pastikan link bisa diakses untuk keperluan verifikasi.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-black text-white text-xl font-bold py-5 rounded-lg hover:bg-gray-900 transition duration-300 uppercase tracking-wider shadow-xl">
                    Kirim Laporan Sekarang
                </button>
            </form>
            <div id="msg" class="mt-6 text-center hidden text-xl font-bold"></div>
        </div>

        <div class="mt-16 p-10 border-4 border-black rounded-lg text-center bg-gray-50">
            <p class="text-black font-extrabold text-lg mb-2 uppercase">Ruang Iklan Strategis</p>
            <p class="text-gray-700 mb-4">Ingin memasang iklan di portal audit rakyat? Hubungi kami segera.</p>
            <a href="#" class="inline-block border-2 border-black px-6 py-2 font-bold hover:bg-black hover:text-white transition">INFO LELANG IKLAN</a>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        const form = document.getElementById('auditForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = 'MENGIRIM DATA...';
            
            const rawData = {
                nama: document.getElementById('nama').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                linkBukti: document.getElementById('linkBukti').value
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(rawData)})
            .then(response => {
                msg.innerHTML = "✅ DATA BERHASIL MASUK KE PUSAT DATA!";
                msg.classList.remove('hidden', 'text-red-600');
                msg.classList.add('text-green-700');
                form.reset();
                btn.disabled = false;
                btn.innerHTML = 'Kirim Laporan Sekarang';
            })
            .catch(error => {
                msg.innerHTML = "❌ GAGAL! PERIKSA KONEKSI ANDA.";
                msg.classList.remove('hidden');
                msg.classList.add('text-red-600');
                btn.disabled = false;
                btn.innerHTML = 'Kirim Laporan Sekarang';
            });
        });
    </script>
</body>
</html>
