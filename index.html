<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL AUDIT RAKYAT - DATA CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
        .header-box { border-bottom: 6px solid #000000; padding-bottom: 20px; margin-bottom: 40px; }
        h1 { font-weight: 900; letter-spacing: -1px; font-size: 2.8rem; line-height: 1.1; }
        label { display: block; font-weight: 800; font-size: 1.2rem; margin-bottom: 8px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 15px; border: 3px solid #000000; font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
        .btn-kirim { background: #000000; color: #ffffff; padding: 20px; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-kirim:hover { background: #333333; }
        .upload-area { border: 3px dashed #ff0000; padding: 20px; background: #fff5f5; margin-bottom: 25px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <div class="header-box text-center">
            <h1>PUSAT DATA AUDIT RAKYAT</h1>
            <p class="text-xl font-bold mt-2">PROJECT AUDIT - KERAHASIAAN DIJAMIN 100%</p>
        </div>

        <form id="auditForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label>Nama / Inisial</label>
                    <input type="text" id="nama" placeholder="Contoh: Eka / Anonim" required>
                </div>
                <div>
                    <label>Sektor Audit</label>
                    <select id="kategori">
                        <option>KORUPSI</option>
                        <option>INFRASTRUKTUR</option>
                        <option>PERPAJAKAN</option>
                        <option>BIROKRASI</option>
                        <option>KRIMINALITAS</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label>Nomor WhatsApp (Aktif)</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 08123456789" required>
                </div>
                <div>
                    <label>Email Pelapor</label>
                    <input type="email" id="email" placeholder="Contoh: pelapor@email.com">
                </div>
            </div>

            <label>Lokasi Kejadian & Instansi</label>
            <input type="text" id="lokasi" placeholder="Sebutkan Kota, Kecamatan, atau Nama Dinas/Instansi" required>

            <label>Detail Temuan Audit (Jelaskan Secara Rinci)</label>
            <textarea id="deskripsi" rows="6" placeholder="Ceritakan apa yang terjadi secara detail..."></textarea>

            <div class="upload-area text-center">
                <label style="color: #ff0000;">UNGGAH BUKTI FOTO & VIDEO</label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*" class="border-0">
                <p class="text-sm font-bold mt-1">Bisa pilih lebih dari 1 file (Maks. 5 file).</p>
            </div>

            <button type="submit" id="submitBtn" class="btn-kirim">Kirim Laporan Ke Pusat Data</button>
        </form>

        <div id="status" class="mt-6 text-center hidden text-2xl font-black"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        const cloudName = 'dz9es8mz9';
        const uploadPreset = 'GANTI_DENGAN_PRESET_ANDA'; // Masukkan kode preset Anda di sini

        const form = document.getElementById('auditForm');
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = "SEDANG MENGUNGGAH BUKTI...";

            const files = document.getElementById('fileInput').files;
            let fileUrls = [];

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('file', files[i]);
                formData.append('upload_preset', uploadPreset);
                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const resData = await res.json();
                    fileUrls.push(resData.secure_url);
                } catch (err) { console.error(err); }
            }

            btn.innerHTML = "MENYIMPAN DATA...";
            const dataPayload = {
                nama: document.getElementById('nama').value,
                whatsapp: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                linkBukti: fileUrls.join(", ")
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(dataPayload)})
            .then(res => {
                statusMsg.innerHTML = "✅ LAPORAN BERHASIL MASUK!";
                statusMsg.classList.remove('hidden');
                statusMsg.style.color = "green";
                form.reset();
                btn.disabled = false;
                btn.innerHTML = "Kirim Laporan Ke Pusat Data";
            })
            .catch(err => {
                statusMsg.innerHTML = "❌ GAGAL!";
                statusMsg.classList.remove('hidden');
                statusMsg.style.color = "red";
                btn.disabled = false;
                btn.innerHTML = "Kirim Laporan Ke Pusat Data";
            });
        });
    </script>
</body>
</html>
