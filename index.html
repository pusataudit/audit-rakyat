<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Rakyat - Pusat Laporan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .gemini-gradient { background: linear-gradient(70deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-semibold mb-2 gemini-gradient">Halo, Eka</h1>
            <p class="text-gray-600 text-lg">Ada temuan apa hari ini? Mari audit untuk Indonesia yang lebih baik.</p>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <form id="auditForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pelapor / Inisial</label>
                    <input type="text" id="nama" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Contoh: Eka / Anonim" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sektor Audit</label>
                        <select id="kategori" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none">
                            <option>Korupsi</option>
                            <option>Infrastruktur</option>
                            <option>Pajak</option>
                            <option>Birokrasi</option>
                            <option>Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Kejadian</label>
                        <input type="text" id="lokasi" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="Kota / Instansi">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Detail Laporan</label>
                    <textarea id="deskripsi" rows="4" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="Jelaskan temuan Anda secara rinci..." required></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 text-red-500 font-bold">Bukti Foto/Video (Link/File)</label>
                    <input type="text" id="linkBukti" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none mb-2" placeholder="Tempel link foto/video di sini">
                    <p class="text-xs text-gray-400">*Gunakan layanan upload gratis untuk mendapatkan link bukti.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-black text-white font-semibold py-4 rounded-xl hover:bg-gray-800 transition duration-300 shadow-lg">
                    Kirim Laporan Audit
                </button>
            </form>
            <div id="msg" class="mt-4 text-center hidden font-medium"></div>
        </div>

        <div class="mt-12 p-8 border-2 border-dashed border-gray-200 rounded-2xl text-center">
            <p class="text-gray-400 mb-2">Slot Iklan Strategis</p>
            <p class="text-sm font-semibold text-blue-600 cursor-pointer">Hubungi Admin untuk Pasang Iklan Disini</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        const form = document.getElementById('auditForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = 'Sedang Mengirim...';
            
            const rawData = {
                nama: document.getElementById('nama').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                deskripsi: document.getElementById('deskripsi').value,
                linkBukti: document.getElementById('linkBukti').value
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(rawData)})
            .then(response => {
                msg.innerHTML = "✅ Laporan Berhasil Diterima! Cek Google Sheets Anda.";
                msg.classList.remove('hidden', 'text-red-500');
                msg.classList.add('text-green-600');
                form.reset();
                btn.disabled = false;
                btn.innerHTML = 'Kirim Laporan Audit';
            })
            .catch(error => {
                msg.innerHTML = "❌ Gagal mengirim. Cek koneksi Anda.";
                msg.classList.remove('hidden');
                msg.classList.add('text-red-500');
                btn.disabled = false;
                btn.innerHTML = 'Kirim Laporan Audit';
            });
        });
    </script>
</body>
</html>
