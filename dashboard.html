<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD MONITORING - AUDIT RAKYAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #1e293b; }
        .card-stat { background: white; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; }
        .card-stat:hover { border-color: #3b82f6; transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; text-transform: uppercase; color: #64748b; font-weight: 800; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-6 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 no-print">
            <h1 class="text-2xl font-black uppercase tracking-tight">Monitoring Dashboard</h1>
            <button onclick="window.print()" class="bg-slate-900 text-white px-5 py-2 rounded-lg font-bold text-sm">CETAK LAPORAN</button>
        </header>

        <div class="mb-10 p-8 bg-slate-900 rounded-[32px] text-white flex flex-col md:flex-row justify-between items-center shadow-xl border-b-8 border-blue-500">
            <div>
                <p class="text-blue-400 font-black uppercase text-xs mb-1">Total Estimasi Kerugian Negara</p>
                <h2 class="text-4xl md:text-5xl font-black tracking-tighter" id="totalLoss">Rp 0</h2>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <p class="text-slate-400 font-bold uppercase text-[10px]">Total Kasus</p>
                <p class="text-3xl font-black" id="totalReports">0</p>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8 no-print" id="statsContainer"></div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="font-black text-slate-800 text-xs uppercase tracking-widest" id="tableTitle">Log Investigasi</h2>
                <button onclick="filterBy('ALL')" class="text-blue-600 font-black text-xs no-print">SEMUA DATA</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Wilayah & Tanggal</th>
                            <th>Pelapor</th>
                            <th>Sektor</th>
                            <th>Nilai Kerugian</th>
                            <th>Bukti File</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwy3PfCc4gIWkywnkE7vTvC77JYSvFhF7G_emjILVJYFS0ko7tqLDOQoajsulJE5ddj/exec';
        let allData = [];

        async function fetchData() {
            const res = await fetch(scriptURL + "?action=read");
            const raw = await res.json();
            allData = raw.slice(1);
            renderStats();
            renderTable(allData);
        }

        function formatRp(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0); }

        function renderStats() {
            let total = 0;
            const counts = {};
            allData.forEach(r => {
                total += parseFloat(r[10]) || 0;
                counts[r[4]] = (counts[r[4]] || 0) + 1;
            });
            document.getElementById('totalLoss').innerText = formatRp(total);
            document.getElementById('totalReports').innerText = allData.length;

            const container = document.getElementById('statsContainer');
            container.innerHTML = '';
            Object.keys(counts).forEach(c => {
                const card = document.createElement('div');
                card.className = "card-stat";
                card.onclick = () => filterBy(c);
                card.innerHTML = `<p class="text-slate-400 font-bold text-[9px] uppercase">${c}</p><h3 class="text-xl font-black">${counts[c]}</h3>`;
                container.appendChild(card);
            });
        }

        function renderTable(rows) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            rows.forEach(r => {
                const tr = document.createElement('tr');
                let links = "-";
                if(r[7]) {
                    links = r[7].split(", ").map((u, i) => {
                        let icon = u.includes('.pdf') ? '📄' : (u.includes('.xls') ? '📊' : '🖼️');
                        return `<a href="${u}" target="_blank" class="mr-1 p-1 bg-slate-100 rounded">${icon}</a>`;
                    }).join("");
                }
                tr.innerHTML = `
                    <td class="font-black text-blue-600">${r[8]}</td>
                    <td><p class="font-bold uppercase text-[11px]">${r[5]}</p><p class="text-[9px] text-slate-400">${new Date(r[0]).toLocaleDateString()}</p></td>
                    <td><p class="font-bold">${r[1]}</p><p class="text-[9px] text-slate-500">${r[2]}</p></td>
                    <td><span class="px-2 py-0.5 rounded-full text-[9px] font-black bg-slate-100 uppercase">${r[4]}</span></td>
                    <td class="font-black text-red-600">${formatRp(r[10])}</td>
                    <td>${links}</td>
                    <td><span class="text-[9px] font-black px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full">${r[9] || 'OPEN'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterBy(c) {
            renderTable(c === 'ALL' ? allData : allData.filter(r => r[4] === c));
            document.getElementById('tableTitle').innerText = c === 'ALL' ? "Log Investigasi" : `Sektor: ${c}`;
        }
        fetchData();
    </script>
</body>
</html>
