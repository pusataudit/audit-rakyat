<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND CENTER - AUDITOR VIEW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #1e293b; }
        .alert-row { background-color: #fee2e2 !important; border-left: 5px solid #ef4444 !important; }
        .table-container { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; border-bottom: 2px solid #edf2f7; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; vertical-align: top; }
        .status-badge { padding: 4px 10px; border-radius: 99px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .badge-open { background: #dcfce7; color: #166534; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 no-print">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase italic text-slate-900">Audit Command Center</h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Pantauan Investigasi Real-Time</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <input type="text" id="searchBox" onkeyup="filterTable()" placeholder="Cari Nama/PT/Wilayah..." class="p-3 border rounded-xl text-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="location.reload()" class="bg-slate-900 text-white px-6 py-3 rounded-xl text-xs font-black hover:bg-black transition">REFRESH</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 no-print">
            <div class="bg-white p-6 rounded-2xl border-b-4 border-blue-500 shadow-sm">
                <p class="text-slate-400 text-[10px] font-black uppercase mb-1">Total Laporan</p>
                <h3 id="statTotal" class="text-3xl font-black text-slate-900">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border-b-4 border-red-500 shadow-sm">
                <p class="text-red-400 text-[10px] font-black uppercase mb-1">High Alert (>1M)</p>
                <h3 id="statAlert" class="text-3xl font-black text-red-600">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border-b-4 border-emerald-500 shadow-sm">
                <p class="text-emerald-400 text-[10px] font-black uppercase mb-1">Wilayah Terpantau</p>
                <h3 id="statWilayah" class="text-3xl font-black text-emerald-600">0</h3>
            </div>
        </div>

        <div class="table-container border">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse" id="auditTable">
                    <thead>
                        <tr>
                            <th>ID & Tgl</th>
                            <th>Identitas Pelapor</th>
                            <th>Otoritas Wilayah</th>
                            <th>Sektor & Modus</th>
                            <th>Nilai Kerugian</th>
                            <th>Bukti</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
            <div id="loadingState" class="p-20 text-center text-slate-400 font-bold animate-pulse">
                MENGAMBIL DATA DARI SISTEM...
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzaNURWmMEXgyzZzw4hpDiaZjHvjzTo---vwJUcAtPRxd0E5ERk4GuRmdTZc7MDC8-c/exec';

        async function loadData() {
            try {
                const response = await fetch(scriptURL + "?action=read");
                const allRows = await response.json();
                const data = allRows.slice(1); // Hapus Header
                const tbody = document.getElementById('tableBody');
                document.getElementById('loadingState').style.display = 'none';

                let alertCount = 0;
                let wilayahSet = new Set();

                // Urutkan dari yang terbaru (Descending)
                data.reverse().forEach(row => {
                    const tr = document.createElement('tr');
                    const kerugian = parseFloat(row[15]) || 0; // Kolom P
                    const reportID = row[13] || "N/A"; // Kolom N
                    
                    // ALERT MERAH JIKA KERUGIAN >= 1 MILIAR
                    if (kerugian >= 1000000000) {
                        tr.className = "alert-row";
                        alertCount++;
                    }

                    if(row[3]) wilayahSet.add(row[3]); // Hitung Provinsi

                    // Pecah Link Bukti
                    let linksHtml = "-";
                    if(row[12] && row[12].trim() !== "") { // Kolom M
                        linksHtml = row[12].split(",").map((link, i) => 
                            `<a href="${link.trim()}" target="_blank" class="inline-block bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 border border-blue-100 hover:bg-blue-600 hover:text-white transition">FILE ${i+1}</a>`
                        ).join("");
                    }

                    tr.innerHTML = `
                        <td>
                            <p class="font-black text-blue-600 text-xs">#${reportID}</p>
                            <p class="text-[9px] text-slate-400 uppercase font-bold">${new Date(row[0]).toLocaleDateString('id-ID')}</p>
                        </td>
                        <td>
                            <p class="font-bold text-xs text-slate-800">${row[1]}</p>
                            <p class="text-[10px] text-slate-500">${row[8]}</p>
                            <p class="text-[9px] text-blue-500 italic">${row[9]}</p>
                        </td>
                        <td>
                            <p class="font-black text-[10px] uppercase text-slate-700">${row[3]} - ${row[4]}</p>
                            <p class="text-[9px] text-slate-500">${row[5]}, ${row[6]}</p>
                        </td>
                        <td>
                            <p class="font-bold text-[10px] text-slate-800">${row[10]}</p>
                            <p class="text-[10px] text-slate-500 italic max-w-xs truncate hover:whitespace-normal transition-all duration-300">"${row[11]}"</p>
                        </td>
                        <td>
                            <p class="font-black ${kerugian >= 1000000000 ? 'text-red-600' : 'text-slate-900'} text-xs">
                                ${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(kerugian)}
                            </p>
                        </td>
                        <td class="max-w-[120px]">${linksHtml}</td>
                        <td>
                            <span class="status-badge badge-open">${row[14] || 'OPEN'}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Update Stats
                document.getElementById('statTotal').innerText = data.length;
                document.getElementById('statAlert').innerText = alertCount;
                document.getElementById('statWilayah').innerText = wilayahSet.size;

            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerHTML = "<span class='text-red-500'>GAGAL MEMUAT DATA. PASTIKAN URL SCRIPT BENAR DAN IZIN DIBERIKAN.</span>";
            }
        }

        function filterTable() {
            const input = document.getElementById("searchBox").value.toUpperCase();
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        loadData();
    </script>
</body>
</html>
