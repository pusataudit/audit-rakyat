<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD EKSEKUTIF - AUDIT RAKYAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #1e293b; }
        .card-stat { background: white; border-radius: 20px; padding: 24px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-stat:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .table-container { background: white; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; }
        th { background: #f8fafc; padding: 16px; text-align: left; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 800; }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .btn-print { background: #1e293b; color: white; padding: 10px 24px; border-radius: 12px; font-weight: bold; transition: 0.3s; }
        @media print { .no-print { display: none; } body { background: white; } .table-container { border: none; } }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 no-print gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-slate-900">PUSAT MONITORING AUDIT</h1>
                <p class="text-slate-500 font-medium italic">Data Agregat Temuan Lapangan & Investigasi</p>
            </div>
            <div class="flex gap-4">
                <button onclick="fetchData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg">REFRESH DATA</button>
                <button onclick="window.print()" class="btn-print">CETAK A4</button>
            </div>
        </header>

        <div class="mb-10 p-8 bg-slate-900 rounded-[32px] text-white flex flex-col md:flex-row justify-between items-center shadow-2xl border-b-8 border-emerald-500">
            <div>
                <p class="text-emerald-400 font-black uppercase tracking-widest text-sm mb-2">Total Potensi Kerugian Negara (Akumulasi)</p>
                <h2 class="text-5xl md:text-6xl font-black tracking-tighter" id="totalLoss">Rp 0</h2>
            </div>
            <div class="mt-6 md:mt-0 text-right">
                <p class="text-slate-400 font-bold uppercase text-xs">Total Laporan Terverifikasi</p>
                <p class="text-4xl font-black" id="totalReports">0</p>
            </div>
        </div>

        <h2 class="text-xs font-black text-slate-400 uppercase mb-4 ml-2 no-print">Sektor Investigasi (Klik untuk Filter)</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-6 mb-10 no-print" id="statsContainer">
            </div>

        <div class="table-container">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="font-black text-slate-800 uppercase tracking-widest text-sm" id="tableTitle">Log Laporan Masuk</h2>
                <button onclick="filterBy('ALL')" class="text-blue-600 font-black text-xs no-print hover:underline">LIHAT SEMUA</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th>ID Laporan</th>
                            <th>Wilayah & Instansi</th>
                            <th>Identitas</th>
                            <th>Sektor</th>
                            <th>Estimasi Kerugian</th>
                            <th>Bukti File</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxpVKya-bNOqAaYrls52OTQ-nZni7NtD9905aMmhQnSj0SNkuEMBZ7lJKzNbqy4wbYN/exec';
        let allData = [];

        async function fetchData() {
            const response = await fetch(scriptURL + "?action=read");
            const rawData = await response.json();
            allData = rawData.slice(1); 
            renderGlobalStats();
            renderCategoryStats();
            renderTable(allData);
        }

        function formatRp(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        }

        function renderGlobalStats() {
            let total = 0;
            allData.forEach(row => {
                let val = parseFloat(row[10]) || 0; // Kolom K (Kerugian)
                total += val;
            });
            document.getElementById('totalLoss').innerText = formatRp(total);
            document.getElementById('totalReports').innerText = allData.length;
        }

        function renderCategoryStats() {
            const container = document.getElementById('statsContainer');
            container.innerHTML = '';
            const counts = {};
            allData.forEach(row => { counts[row[4]] = (counts[row[4]] || 0) + 1; });

            Object.keys(counts).forEach(cat => {
                const card = document.createElement('div');
                card.className = "card-stat";
                card.onclick = () => filterBy(cat);
                card.innerHTML = `
                    <p class="text-slate-400 font-bold text-[10px] uppercase mb-1">${cat.replace('_', ' ')}</p>
                    <h3 class="text-3xl font-black text-slate-800">${counts[cat]}</h3>
                    <p class="text-[9px] text-blue-500 font-bold mt-2">LIHAT DETAIL →</p>
                `;
                container.appendChild(card);
            });
        }

        function renderTable(dataRows) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            dataRows.forEach(row => {
                const tr = document.createElement('tr');
                let links = "-";
                if(row[7]) {
                    links = row[7].split(", ").map((url, i) => {
                        let icon = url.includes('.pdf') ? '📄' : (url.includes('.xls') ? '📊' : (url.includes('.mp4') ? '🎥' : '🖼️'));
                        return `<a href="${url}" target="_blank" class="inline-block p-2 bg-slate-100 rounded-lg hover:bg-blue-100 transition mr-1">${icon}</a>`;
                    }).join("");
                }

                tr.innerHTML = `
                    <td class="font-black text-blue-600">#${row[8]}</td>
                    <td>
                        <p class="font-extrabold text-slate-800 uppercase">${row[5]}</p>
                        <p class="text-[10px] text-slate-400 mt-1">${new Date(row[0]).toLocaleString()}</p>
                    </td>
                    <td>
                        <p class="font-bold">${row[1]}</p>
                        <p class="text-[10px] text-slate-500">${row[2]}</p>
                    </td>
                    <td><span class="px-2 py-1 rounded-full text-[9px] font-black bg-slate-100 text-slate-600 uppercase border border-slate-200">${row[4]}</span></td>
                    <td class="font-black text-red-600">${formatRp(row[10])}</td>
                    <td>${links}</td>
                    <td><span class="text-[10px] font-black px-2 py-1 bg-emerald-100 text-emerald-700 rounded-full">${row[9] || 'OPEN'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterBy(cat) {
            if(cat === 'ALL') {
                renderTable(allData);
                document.getElementById('tableTitle').innerText = "Log Laporan Masuk";
            } else {
                const filtered = allData.filter(row => row[4] === cat);
                renderTable(filtered);
                document.getElementById('tableTitle').innerText = `SEKTOR: ${cat.replace('_', ' ')}`;
            }
        }

        fetchData();
    </script>
</body>
</html>
